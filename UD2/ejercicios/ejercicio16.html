    <h1> Patatas fritas</h1>

    <hr>

    <figure></figure>

        <img src = "imagenes/16-patatas-fritas.png" width = 288 height = 185>
    
        <figcaption> Patatas fritas caseras </figcaption>
    
    </figure>

    <h2> Ingredientes </h2>

        <ul> 

            <li> 3 ó 4 patatas</li>

            <li> 4 dientes de ajo</li>

            <li> Aceite de oliva</li>

            <li> Sal</li>

        </ul>

    <h2> Elaboracion Pasos</h2>    


        <ul>

            <li>Calentar aceite en una sarten </li>

            <li>Añadir las patatas, sal, ajos </li>

            <li>Freir al gusto </li>

            <li>Servir en el plato </li>
        </ul>
