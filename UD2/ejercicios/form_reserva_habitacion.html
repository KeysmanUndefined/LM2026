<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formularios</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    
<form action="reserva.php" method="get">
    <fieldset>
        <legend>Datos del solicitante</legend>

        Nombre del solicitante de la reserva:

        <br>
        <input type="text" id="nombre" name="nombre"
               pattern="[a-z A-Z]{100}" size="50"
               autocomplete="on" autofocus>

        <br>      

        <label for="telefono">Teléfono de contacto</label>
        <input type="tel" id="telefono" name="telefono"
               pattern="[0-9]{8}-[A-Z]" placeholder="9 números"size="9"
               autocomplete="on">

        <br>
        
        <label for="dni">DNI (Seleccione un archivo de imagen)
        <input type="file" accept="image/*" required />
        </label>
                        

    </fieldset>

    <fieldset>
        <legend>Datos de la reserva</legend>
        Habitacion:

        <br>
        <select name="color" size="4">
        <option value="1"selected>Azul</option>
        <option value="2">Verde</option>
        <option value="3">Amarilla</option>
        <option value="4">Morada</option>
        </select>
       
        <br>



        <select name="ocupacion" size="2">
        <option value="1"selected>Individual</option>
        <option value="2">Doble</option>
        </select>

        <br>

        Provincia:

        <br>
        
        <select name="provincias" size="4">

        <optgroup label="Galicia"></optgroup>
        <option value="1">A Coruña</option>
        <option value="2">Lugo</option>
        <option value="3">Ourense</option>
        <option value="4">Pontevedra</option>

        <optgroup label="País Vasco"></optgroup>
        <option value="1">Alava</option>
        <option value="2">Guipuzcoa</option>
        <option value="3">Vizcaya</option>
        </select>
       
       
        
    </fieldset>


        <button type="submit" value="Validar">
        <img src="imagenes/ok.jpg" alt="error img" alt="Validar" width="40">
        Validar
        </button>
       
        <button type="reset" value="Limpiar">
         <img src="imagenes/not.png" alt="error img" alt="Limpiar"width="40">
         Limpiar
         </button>

</form>

</body>
</html>
